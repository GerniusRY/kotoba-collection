<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1427"><title>ことばコレクション v2.4</title><link rel="stylesheet" href="style.css?v=24"></head><body><div id="rotateNotice" role="status"><div class="rotate-icon">📱 ↻</div><div>スマホを よこにしてね</div><small>よこむきで あそぶ ゲームだよ</small></div><div id="app"><header><div class="brand">ことばコレクション <small>ことばが ほんものに！</small></div><div class="header-actions"><span id="micState" class="status">● マイク準備中</span><button id="libraryBtn" class="icon-btn">ずかん</button><button id="settingsBtn" class="icon-btn">⚙</button></div></header><div id="collection" class="collection" aria-label="今回のコレクション"></div><main><div id="turn" class="turn hidden"></div><div id="stage"><canvas id="scene"></canvas><img id="photo" class="hidden" alt=""><div id="empty" class="empty"><div class="empty-symbol">✦</div><div>ことばを いってみよう</div><small>「りんご」「ぞう」「くるま」</small></div><div id="word" class="word"></div><div id="effect" class="effect"></div><div id="gameLayer" class="game-layer hidden"><div id="gamePanel" class="game-panel"></div><button id="nextQuiz" class="quiz-next" type="button">つぎの もんだい</button></div></div><div class="prompt" id="prompt">マイクを はじめると ことばが でてくるよ</div></main><footer><button id="startBtn" class="primary">🎤 マイクをはじめる</button><button id="modeBtn">あそび：コレクション</button><button id="helpBtn">ことばを入力</button></footer></div><dialog id="settings"><h2>あそびの せってい</h2><label>ゲームモード<select id="mode"><option value="collect">ことばコレクション</option><option value="easy">おやこしりとり（やさしい）</option><option value="battle">おやこしりとり（たいせん）</option></select></label><label>あそびを えらぶ<select id="playMode"><option value="words">ことばコレクション</option><option value="quiz">こえで さがそう</option><option value="chest">たからばこ</option><option value="pet">ドラゴン100もんクイズ</option><option value="train">ことばの でんしゃ</option></select></label><div class="game-stats"><span id="petStatus">🐲 0</span><span id="trainStatus">🚂 0</span></div><p class="note">まほうのことば：「あか」「あお」「おおきくなあれ」「ちいさくなあれ」「とんで」</p><label>最初の番<select id="first"><option value="child">こども</option><option value="parent">おとな</option></select></label><label><input id="tts" type="checkbox"> ことばを読み上げる</label><label><input id="sounds" type="checkbox" checked> 効果音を鳴らす</label><p class="note">音声はこの端末のブラウザで認識します。音声の保存は行いません。マイクが動かない場合は「ことばを入力」を使用してください。</p><button id="resetSession" class="danger">今回のコレクションをリセット</button><button class="close">もどる</button></dialog><dialog id="library"><h2>ことばずかん <span id="libraryCount"></span></h2><div id="libraryGrid" class="library-grid"></div><button class="close">もどる</button></dialog><dialog id="manual"><h2>ことばを入力</h2><form id="manualForm"><input id="manualWord" placeholder="例：きりん" maxlength="35" autocomplete="off" required><button class="primary" type="submit">だす</button></form><p class="note">音声認識が難しいときの保護者用操作です。</p><button class="close">もどる</button></dialog><script type="module" src="app.js?v=24"></script></body></html>
